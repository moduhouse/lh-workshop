name: architex 대시보드 빌드·배포

on:
  push:
    branches: [master]
    paths:
      - "architex/data/**"
      - "architex/template.html"
      - "architex/scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: architex-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 데이터 검증
        run: python architex/scripts/validate_items.py

      - name: 대시보드 빌드
        run: python architex/scripts/build_dashboard.py

      - name: 변경사항 커밋·푸시
        run: |
          git config user.name "architex-bot"
          git config user.email "actions@github.com"
          git add architex/architex_dashboard.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "build: architex 대시보드 자동 재생성 [skip ci]"
            git push
          fi
